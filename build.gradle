plugins {
    id 'java'
    id 'jacoco'
    id 'application'
    id 'org.graalvm.buildtools.native' version '1.1.18'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'info.picocli:picocli:4.7.7'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// The CLI's version string comes from the build: `-Pversion=1.2.3` (CI passes
// the release tag minus its leading v). Local builds print 0.0.0-dev. The
// value is written into a generated class as a compile-time constant, so the
// picocli annotation can use it and native-image needs no resource or
// reflection config.
if (version == 'unspecified') {
    version = '0.0.0-dev'
}
if (!(version.toString() ==~ /[0-9A-Za-z][0-9A-Za-z.+-]*/)) {
    throw new GradleException("version '${version}' must be a plain version string (letters, digits, . + -)")
}
def generateVersion = tasks.register('generateVersion') {
    def outDir = layout.buildDirectory.dir('generated/sources/version/java/main')
    def versionString = version.toString()
    inputs.property('version', versionString)
    outputs.dir(outDir)
    doLast {
        def file = outDir.get().file('net/sonofgarr/dirty/Version.java').asFile
        file.parentFile.mkdirs()
        file.text = """package net.sonofgarr.dirty;

/** Generated by the generateVersion Gradle task from the build's version; do not edit. */
final class Version {
    static final String VERSION = "${versionString}";

    private Version() {
    }
}
"""
    }
}
sourceSets.main.java.srcDir(generateVersion)

compileJava {
    // picocli-codegen writes GraalVM reflection config under
    // META-INF/native-image/picocli-generated/<project>/ at compile time.
    options.compilerArgs += ["-Aproject=${project.name}"]
}

application {
    mainClass = 'net.sonofgarr.dirty.App'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Native image. Requires a GraalVM JDK: the plugin looks at GRAALVM_HOME, then
// JAVA_HOME, then the JVM running Gradle. Locally: `sdk env` (see .sdkmanrc).
// In CI: graalvm/setup-graalvm. Plain `./gradlew build` does not need GraalVM.
//
// The shared reachability-metadata repository is on by default. It supplies
// picocli's own metadata, complementing the reflection config picocli-codegen
// generates at compile time. It is fetched from Maven Central on first use.
graalvmNative {
    binaries {
        main {
            imageName = 'dirty'
            mainClass = 'net.sonofgarr.dirty.App'
            fallback = false
        }
    }
}

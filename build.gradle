plugins {
    id 'java'
    id 'jacoco'
    id 'application'
    id 'org.graalvm.buildtools.native' version '1.1.18'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'info.picocli:picocli:4.7.7'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

compileJava {
    // picocli-codegen writes GraalVM reflection config under
    // META-INF/native-image/picocli-generated/<project>/ at compile time.
    options.compilerArgs += ["-Aproject=${project.name}"]
}

application {
    mainClass = 'net.sonofgarr.dirty.App'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Native image. Requires a GraalVM JDK: the plugin looks at GRAALVM_HOME, then
// JAVA_HOME, then the JVM running Gradle. Locally: `sdk env` (see .sdkmanrc).
// In CI: graalvm/setup-graalvm. Plain `./gradlew build` does not need GraalVM.
graalvmNative {
    // The shared reachability-metadata repository only matters for third-party
    // libraries that need reflection config; picocli-codegen generates ours at
    // compile time. Its current schema also needs a newer GraalVM than CE 21.0.2.
    metadataRepository {
        enabled = false
    }
    binaries {
        main {
            imageName = 'dirty'
            mainClass = 'net.sonofgarr.dirty.App'
            fallback = false
        }
    }
}

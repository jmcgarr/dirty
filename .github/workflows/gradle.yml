name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports
          if-no-files-found: ignore

  native:
    name: Native image (linux-x86_64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build native image and run tests inside it
        run: ./gradlew nativeCompile nativeTest
      - name: Smoke test binary
        run: |
          ./build/native/nativeCompile/dirty --version
          ./build/native/nativeCompile/dirty --help
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: dirty-linux-x86_64
          path: build/native/nativeCompile/dirty
          retention-days: 30

name: Release

# Pushing a tag v<X.Y.Z> builds one native binary per platform, publishes a
# GitHub release with the binaries and SHA256SUMS, and asks jmcgarr/homebrew-tap
# to bump Formula/dirty.rb. See specs/009-homebrew-tap-formula.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            asset: dirty-linux-x86_64
          - os: macos-15
            asset: dirty-macos-aarch64
    steps:
      - name: Check tag format
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not vX.Y.Z[-suffix]"; exit 1
          fi
      - uses: actions/checkout@v7
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          version: '25.5'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build, test, and compile the native image
        shell: bash
        run: ./gradlew build nativeCompile -Pversion="${GITHUB_REF_NAME#v}"
      - name: Smoke test
        shell: bash
        run: |
          expected="dirty ${GITHUB_REF_NAME#v}"
          actual="$(./build/native/nativeCompile/dirty --version)"
          test "$actual" = "$expected" || { echo "::error::--version printed '$actual', expected '$expected'"; exit 1; }
          ./build/native/nativeCompile/dirty --help > /dev/null
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp build/native/nativeCompile/dirty "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          set -- dirty-*
          test "$#" -eq 2 || { echo "::error::expected 2 assets, found: $*"; exit 1; }
          sha256sum "$@" > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
      # Bumps Formula/dirty.rb in jmcgarr/homebrew-tap. HOMEBREW_TAP_TOKEN is a
      # fine-grained PAT with Actions read/write on that one repository; while
      # it is not set the release is still complete and the tap is bumped by hand.
      - name: Ask the tap to pick up this release
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
        run: gh workflow run update-formula.yml -R jmcgarr/homebrew-tap -f formula=dirty -f tag="$GITHUB_REF_NAME"
